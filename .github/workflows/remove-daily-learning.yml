name: Remove daily-learning folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: 只刪 daily-learning/，不動旅遊首頁檔
        run: |
          set -euo pipefail
          for locked in index.html app.js styles.css .nojekyll; do
            if [ ! -f "$locked" ]; then
              echo "找不到旅遊網站檔案 $locked，停止以免破壞網站。"
              exit 1
            fi
          done
          sha_index=$(git rev-parse HEAD:index.html)
          sha_js=$(git rev-parse HEAD:app.js)
          sha_css=$(git rev-parse HEAD:styles.css)
          sha_nj=$(git rev-parse HEAD:.nojekyll)
          if [ ! -d daily-learning ]; then
            echo "daily-learning/ 已不存在，無需提交"
            exit 0
          fi
          rm -rf daily-learning
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- daily-learning
          if git diff --staged --quiet; then
            echo "沒有可提交的變更"
            exit 0
          fi
          extra=$(git diff --staged --name-only | grep -v '^daily-learning/' || true)
          if [ -n "$extra" ]; then
            echo "停止：暫存變更超出 daily-learning/："
            echo "$extra"
            exit 1
          fi
          git commit -m "chore: 移除日日學 daily-learning 子目錄（保留旅遊首頁）"
          test "$(git rev-parse HEAD:index.html)" = "$sha_index"
          test "$(git rev-parse HEAD:app.js)" = "$sha_js"
          test "$(git rev-parse HEAD:styles.css)" = "$sha_css"
          test "$(git rev-parse HEAD:.nojekyll)" = "$sha_nj"
          git push
