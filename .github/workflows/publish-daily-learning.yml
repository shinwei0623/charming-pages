name: Publish 日日學 Charming 版

on:
  schedule:
    # 台北 01:00 = 17:00 UTC，晚於 daily-learning-portal 的 16:30 UTC 產文排程
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-learning-charming
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 日日學原始碼（公開庫，不必額外匯證）
        uses: actions/checkout@v4
        with:
          repository: shinwei0623/daily-learning-portal
          path: portal
          persist-credentials: false

      - name: Checkout charming-pages gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: 安裝圖片縮圖與 PDF 所需套件
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-noto-cjk poppler-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: 以 Charming 品牌建置並重產 PDF
        working-directory: portal
        env:
          BRAND: charming
          BRAND_LINK_LABEL: Charming 粉專
          BRAND_LINK_URL: https://www.facebook.com/share/1E33LuxjmU/?mibextid=wwXIfr
          SUPPORTER_TEXT: 日日學網站由 Charming 支持分享
          BASE_PATH: /charming-pages/daily-learning/
          SITE_URL: https://shinwei0623.github.io/charming-pages
        run: |
          python3 scripts/unpack-assets.py
          npm ci
          npm run pdf
          npm run build
          python3 scripts/assert-brand-clean.py dist

      - name: 只更新 gh-pages 的 daily-learning/ 子目錄
        run: |
          set -euo pipefail
          # 拒絕覆寫 Charming 既有前台檔
          for locked in index.html app.js styles.css; do
            if [ ! -f "site/$locked" ]; then
              echo "找不到既有前台檔 site/$locked，停止以免破壞網站。"
              exit 1
            fi
          done
          rm -rf site/daily-learning
          mkdir -p site/daily-learning
          cp -a portal/dist/. site/daily-learning/
          touch site/daily-learning/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A daily-learning
          if git diff --staged --quiet; then
            echo "沒有新檔可提交"
          else
            git commit -m "chore: 更新日日學 Charming 版 $(TZ=Asia/Taipei date +%F)"
            git push
          fi
